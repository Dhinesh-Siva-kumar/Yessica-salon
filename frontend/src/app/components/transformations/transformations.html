<section class="y-trans">
  <svg viewBox="0 0 1440 800" preserveAspectRatio="none" class="y-trans__pattern" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#C9A24B" stroke-width="1" stroke-linecap="round" opacity="0.2">
      <path d="M-100 800 L700 0" />
      <path d="M100 800 L900 0" />
      <path d="M300 800 L1100 0" />
      <path d="M500 800 L1300 0" />
      <path d="M700 800 L1500 0" />
    </g>
    <g fill="none" stroke="#F2CE7D" stroke-width="0.8" stroke-linecap="round" opacity="0.12">
      <path d="M-100 0 L700 800" />
      <path d="M200 0 L1000 800" />
      <path d="M500 0 L1300 800" />
      <path d="M800 0 L1600 800" />
    </g>
  </svg>

  <div class="y-trans__inner">
    <div class="y-section-head">
      <span class="y-eyebrow">Transformations</span>
      <h2>Before &amp; after</h2>
      <div class="y-divider"></div>
    </div>

    <div class="y-trans__carousel" (pointerenter)="pause()" (pointerleave)="resume()" (focusin)="pause()" (focusout)="resume()">
      <button type="button" class="y-trans__arrow y-trans__arrow--prev" (click)="onArrowClick('prev')" aria-label="Previous transformation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5L8 12L15 19" />
        </svg>
      </button>

      <div class="y-trans__viewport"
           tabindex="0"
           role="group"
           aria-label="Before and after transformations"
           (touchstart)="onTouchStart($event)"
           (touchend)="onTouchEnd($event)">
        <div class="y-trans__track" [style.transform]="'translateX(-' + (activeIndex * (100 / visibleCount)) + '%)'">
          @for (tr of items; track tr.id) {
            <div class="y-trans__slide">
              <div class="y-trans__pair">
                <div class="y-trans__photos">
                  <div class="y-trans__photo" [style.background-image]="tr.beforeUrl ? 'url(' + tr.beforeUrl + ')' : null">
                    <div class="y-trans__fade"></div>
                    <span>Before</span>
                  </div>
                  <div class="y-trans__photo y-trans__photo--after" [style.background-image]="tr.afterUrl ? 'url(' + tr.afterUrl + ')' : null">
                    <div class="y-trans__fade"></div>
                    <span>After</span>
                  </div>
                </div>
                <span class="y-trans__title">{{ tr.title }}</span>
              </div>
            </div>
          }
        </div>
      </div>

      <button type="button" class="y-trans__arrow y-trans__arrow--next" (click)="onArrowClick('next')" aria-label="Next transformation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5L16 12L9 19" />
        </svg>
      </button>
    </div>

    <div class="y-trans__dots">
      @for (i of dotIndices; track i) {
        <button type="button"
                class="y-trans__dot"
                [class.is-active]="isGroupActive(i)"
                (click)="goTo(i)"
                [attr.aria-label]="'Go to transformation ' + (i + 1)"></button>
      }
    </div>
  </div>
</section>
