<section id="contact" class="y-contact">
  <svg viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" class="y-contact__pattern" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#C9A24B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.14">
      <path d="M0 620 L260 620 L260 420 L620 420 L620 220 L1000 220 L1000 90 L1440 90" />
      <path d="M0 220 L180 220 L180 340 L440 340 L440 560 L860 560 L860 700 L1440 700" />
      <path d="M700 0 L700 140 L1120 140 L1120 460 L1440 460" />
    </g>
    <g fill="none" stroke="#F2CE7D" stroke-width="1.2" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.3">
      <path d="M0 720 C240 720 260 520 520 520 S760 300 1000 300 S1240 180 1440 160" />
    </g>
    <g fill="#C9A24B" opacity="0.3">
      <circle cx="520" cy="520" r="5" />
      <circle cx="1000" cy="300" r="5" />
      <circle cx="260" cy="420" r="3" />
      <circle cx="1120" cy="460" r="3" />
    </g>
    <g fill="none" stroke="#F2CE7D" stroke-width="1.5" opacity="0.4">
      <path d="M1340 160 C1340 130 1380 130 1380 160 C1380 185 1360 200 1360 200 C1360 200 1340 185 1340 160 Z" />
      <circle cx="1360" cy="158" r="6" />
    </g>
  </svg>

  <div class="y-contact__inner">
    <div class="y-contact__top">
      <div class="y-contact__info">
        <span class="y-eyebrow">Visit &amp; Book</span>
        <h2>Book your appointment</h2>
        <div class="y-divider"></div>

        <div class="y-contact__details">
          <div><span class="y-contact__label">Address</span>{{ contact.address }}</div>
          <div><span class="y-contact__label">Phone &amp; WhatsApp</span>{{ contact.phone }}</div>
          <div><span class="y-contact__label">Working hours</span>{{ contact.hours }}</div>
        </div>

        <div class="y-contact__cta">
          <a href="tel:+917306275778" class="y-btn y-btn--gold">Call Now</a>
          <a [href]="directionsUrl" target="_blank" rel="noopener" class="y-btn y-btn--outline">Get Directions</a>
        </div>
      </div>

      <div class="y-contact__form-col">
        <form class="y-contact__form" [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Phone</mat-label>
            <input matInput formControlName="phone" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Service</mat-label>
            <input matInput formControlName="service" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Preferred date</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="preferredDate" required>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Preferred time</mat-label>
            <mat-select formControlName="preferredTime" required>
              @for (slot of timeSlots; track slot.value) {
                <mat-option [value]="slot.value">{{ slot.label }}</mat-option>
              }
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Notes (optional)</mat-label>
            <textarea matInput formControlName="notes" rows="2"></textarea>
          </mat-form-field>

          <button type="submit" class="y-btn y-btn--gold" [disabled]="submitting()">
            {{ submitting() ? 'Sending…' : 'Request Appointment' }}
          </button>
        </form>
      </div>
    </div>

    <div class="y-contact__map">
      <iframe
        [src]="mapUrl"
        width="100%"
        height="440"
        style="border:0;"
        allowfullscreen="true"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
  </div>
</section>
